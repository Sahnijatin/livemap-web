<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live demo · LiveMap</title>
<meta name="description" content="A replay of a real coding agent adding a feature, shown in LiveMap. Click anything, or drag the timeline to rewind.">
<meta property="og:title" content="LiveMap live demo">
<meta property="og:description" content="Watch a real coding agent build a feature, and see every file, function, route and table it touches.">
<meta property="og:image" content="https://livemap.in/images/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230a7cff'/%3E%3Cstop offset='.5' stop-color='%23a64df0'/%3E%3Cstop offset='1' stop-color='%23ff8a00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='10' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Geist';src:url(/demo/fonts/geist-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Geist';src:url(/demo/fonts/geist-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
:root{--bg:#eef0f5;--ink:#1d1d1f;--ink2:#55595f;--line:rgba(0,0,0,.07);--green:#1fae55;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;--ease:cubic-bezier(.32,.72,0,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d13;--ink:#f2f3f7;--ink2:#b4b9c4;--line:rgba(255,255,255,.08)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
.bar{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.mark{width:24px;height:24px;border-radius:8px;background:conic-gradient(from 210deg,#0a7cff,#a64df0,#f0287a,#ff8a00,#0a7cff)}
.mid{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(31,174,85,.2)}
.acts{display:flex;align-items:center;gap:8px}
.b{font:600 14px var(--sans);border:0;cursor:pointer;border-radius:999px;padding:8px 14px;text-decoration:none;color:var(--ink);background:rgba(127,127,140,.14);white-space:nowrap}
.b.dark{background:var(--ink);color:var(--bg)}
.frame{position:relative;height:calc(100% - 52px)}
iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.scaled iframe{position:absolute;left:0;top:0;transform-origin:0 0}
.tip{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink);
  background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 0 0 1px var(--line),0 12px 36px rgba(17,24,39,.18);transition:opacity .4s var(--ease);max-width:calc(100% - 24px)}
@media (prefers-color-scheme:dark){.tip{background:rgba(30,33,45,.9)}}
.tip.hide{opacity:0;pointer-events:none}
.tip button{border:0;background:none;color:var(--ink2);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px}
@media (max-width:720px){.mid{display:none}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="bar">
  <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>LiveMap</a>
  <div class="mid"><span class="dot"></span>Replay of a real agent session adding order cancellation to a shop app</div>
  <div class="acts">
    <button class="b" id="again" type="button">Replay</button>
    <a class="b dark" href="/#how">Get LiveMap</a>
  </div>
</div>
<div class="frame" id="frame">
  <iframe id="app" title="LiveMap replay" src="/demo/replay.html?autoplay=1"></iframe>
  <div class="tip" id="tip"><span id="tiptext">Click anything: tabs, files, changes. Drag the timeline to rewind.</span><button type="button" aria-label="Dismiss" id="tipx">&times;</button></div>
</div>
<script>
(function(){
  var f=document.getElementById('frame'), ifr=document.getElementById('app'), tip=document.getElementById('tip');
  // Below 1100px wide, show the app at its desktop layout, scaled to fit.
  function fit(){
    var w=f.clientWidth, h=f.clientHeight;
    if(w>=1100){ f.classList.remove('scaled'); ifr.style.width=''; ifr.style.height=''; ifr.style.transform=''; return; }
    var s=w/1280; f.classList.add('scaled'); ifr.style.width='1280px'; ifr.style.height=(h/s)+'px'; ifr.style.transform='scale('+s+')';
    document.getElementById('tiptext').textContent='Best on a larger screen. Pinch to zoom, or open on a laptop.';
  }
  addEventListener('resize',fit); fit();
  document.getElementById('again').addEventListener('click',function(){ ifr.src='/demo/replay.html?autoplay=1&r='+Date.now(); });
  document.getElementById('tipx').addEventListener('click',function(){ tip.classList.add('hide'); });
  setTimeout(function(){ tip.classList.add('hide'); },9000);
})();
</script>
</body>
</html>
